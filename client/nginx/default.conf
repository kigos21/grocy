server {
  listen 80;
  server_name grocy.kigos.dev;

  # location / {
  #   root /usr/share/nginx/html;
  #   index index.html index.htm;
  #   try_files $uri $uri/ /index.html;
  # }

  # Redirect all HTTP traffic to HTTPS
  location / {
      return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  server_name grocy.kigos.dev;

  # SSL configuration - Certbot will manage these files
  ssl_certificate /etc/letsencrypt/live/grocy.kigos.dev/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/grocy.kigos.dev/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  # Reverse proxy for API calls
  location /api/ {
    proxy_pass http://api-nginx/api/; # This will resolve to the api-nginx container
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Reverse proxy for Sanctum calls
  location /sanctum/ {
    # The trailing slash here is important!
    proxy_pass http://api-nginx/sanctum/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
      root   /usr/share/nginx/html;
      index  index.html index.htm;
      try_files $uri $uri/ /index.html;
  }
}