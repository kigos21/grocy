services:
  # Laravel API Service
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: grocy-api
    volumes:
      - ./api:/var/www/html
      - /var/www/html/vendor
    networks:
      - grocy-network
    depends_on:
      - db

  # Nginx for API
  api-nginx:
    image: nginx:alpine
    container_name: grocy-api-nginx
    ports:
      - "8000:80"
    volumes:
      - ./api:/var/www/html
      - ./api/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - grocy-network
    depends_on:
      - api

  # React Client Service
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: grocy-client
    ports:
      - "3000:80"
    networks:
      - grocy-network

  # MySQL Database Service
  db:
    image: mysql:8.0
    container_name: grocy-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - grocy-db-data:/var/lib/mysql
    networks:
      - grocy-network

networks:
  grocy-network:
    driver: bridge

volumes:
  grocy-db-data:
    driver: local
